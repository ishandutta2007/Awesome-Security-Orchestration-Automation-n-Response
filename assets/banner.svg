<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="40%" stop-color="#0d131f" />
      <stop offset="70%" stop-color="#09182b" />
      <stop offset="100%" stop-color="#060d17" />
    </linearGradient>

    <!-- Cyber Accent Gradient -->
    <linearGradient id="cyber-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#4facfe" />
      <stop offset="70%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>

    <!-- Shield & Node Gradients -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <linearGradient id="pipe-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="shield-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7000ff" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#00f2fe" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes laserScan {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { transform: translateY(280px); opacity: 0.2; }
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.75; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes floatEffect {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes circuitFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .laser-scanner {
        animation: laserScan 4.5s ease-in-out infinite alternate;
      }
      .pulsing-shield {
        animation: floatEffect 5s ease-in-out infinite;
        transform-origin: 170px 210px;
      }
      .active-pulse {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      .circuit-line {
        stroke-dasharray: 8 6;
        animation: circuitFlow 6s linear infinite;
      }
      .radar-arm {
        transform-origin: 170px 210px;
        animation: radarSweep 8s linear infinite;
      }
      .title-main {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Ubuntu, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .sub-badge {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .body-mono {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background Frame -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Cyber Grid Lines -->
  <g stroke="#00f2fe" stroke-opacity="0.04" stroke-width="1">
    <path d="M0,70 L1200,70 M0,140 L1200,140 M0,210 L1200,210 M0,280 L1200,280 M0,350 L1200,350" />
    <path d="M100,0 L100,420 M200,0 L200,420 M300,0 L300,420 M400,0 L400,420 M500,0 L500,420 M600,0 L600,420 M700,0 L700,420 M800,0 L800,420 M900,0 L900,420 M1000,0 L1000,420 M1100,0 L1100,420" />
  </g>

  <!-- Large Ambient Glow -->
  <circle cx="170" cy="210" r="180" fill="url(#shield-glow)" />

  <!-- Circuit Pipelines / Orchestration Workflows in Background -->
  <g fill="none" stroke-width="2">
    <path d="M 330 110 L 460 110 L 510 160 L 760 160" stroke="#00f2fe" stroke-opacity="0.25" class="circuit-line" />
    <path d="M 330 210 L 530 210 L 580 260 L 890 260" stroke="#7000ff" stroke-opacity="0.3" class="circuit-line" />
    <path d="M 330 310 L 480 310 L 540 270 L 800 270" stroke="#38ef7d" stroke-opacity="0.2" class="circuit-line" />
  </g>

  <!-- Left: Interactive Shield / Radar Symbol -->
  <g class="pulsing-shield">
    <circle cx="170" cy="210" r="110" fill="none" stroke="#00f2fe" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="170" cy="210" r="85" fill="none" stroke="#7000ff" stroke-opacity="0.2" stroke-width="1.5"/>
    <circle cx="170" cy="210" r="58" fill="none" stroke="#00f2fe" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <g class="radar-arm">
      <line x1="170" y1="210" x2="270" y2="210" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.6"/>
      <polygon points="170,210 270,185 270,210" fill="#00f2fe" fill-opacity="0.12"/>
    </g>

    <polygon points="170,110 240,150 240,250 170,300 100,250 100,150" 
             fill="#0c182a" fill-opacity="0.7" stroke="url(#cyber-accent)" stroke-width="3.5" stroke-linejoin="round" />

    <path d="M 170 145 L 215 168 L 215 220 C 215 255 170 278 170 278 C 170 278 125 255 125 220 L 125 168 Z" 
          fill="none" stroke="url(#shield-grad)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>

    <polygon points="170,175 185,202 173,202 178,225 158,206 168,206" fill="#00f2fe" class="active-pulse"/>
    
    <circle cx="170" cy="110" r="4.5" fill="#00f2fe" />
    <circle cx="240" cy="150" r="4.5" fill="#38ef7d" />
    <circle cx="240" cy="250" r="4.5" fill="#7000ff" />
    <circle cx="170" cy="300" r="4.5" fill="#ff007a" />
    <circle cx="100" cy="250" r="4.5" fill="#4facfe" />
    <circle cx="100" cy="150" r="4.5" fill="#00f2fe" />
  </g>

  <g class="laser-scanner">
    <line x1="80" y1="90" x2="260" y2="90" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <polygon points="80,90 260,90 240,105 100,105" fill="#00f2fe" opacity="0.2" />
  </g>

  <g transform="translate(350, 0)">
    <g transform="translate(0, 68)">
      <rect width="260" height="28" rx="14" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.35" stroke-width="1.2"/>
      <circle cx="15" cy="14" r="4" fill="#38ef7d" class="active-pulse"/>
      <text x="27" y="19" class="sub-badge" font-size="11" fill="#00f2fe">SOAR &amp; SECOPS ECOSYSTEM</text>
    </g>

    <text x="0" y="145" class="title-main" font-size="44" fill="#FFFFFF">Awesome Security Orchestration,</text>
    <text x="0" y="198" class="title-main" font-size="44" fill="url(#cyber-accent)">Automation &amp; Response</text>

    <text x="0" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">
      Enterprise SOAR • Open-Source Frameworks • Incident Response • Hyperautomation
    </text>

    <g transform="translate(0, 275)">
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="#132034" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1.2"/>
        <text x="14" y="22" class="body-mono" fill="#38ef7d">⚡ Alert Enrichment</text>
      </g>
      <g transform="translate(192, 0)">
        <rect width="185" height="34" rx="8" fill="#132034" stroke="#7000ff" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="14" y="22" class="body-mono" fill="#a78bfa">📋 Auto Playbooks</text>
      </g>
      <g transform="translate(389, 0)">
        <rect width="180" height="34" rx="8" fill="#132034" stroke="#ff007a" stroke-opacity="0.3" stroke-width="1.2"/>
        <text x="14" y="22" class="body-mono" fill="#f472b6">🎯 Threat Intel CTI</text>
      </g>
      <g transform="translate(581, 0)">
        <rect width="190" height="34" rx="8" fill="#132034" stroke="#4facfe" stroke-opacity="0.3" stroke-width="1.2"/>
        <text x="14" y="22" class="body-mono" fill="#38bdf8">🛡️ Case Management</text>
      </g>
    </g>

    <g transform="translate(0, 342)">
      <text x="0" y="16" class="body-mono" fill="#94A3B8" font-size="13">
        Pipeline: Alert Ingest <tspan fill="#00f2fe">→</tspan> Normalization <tspan fill="#00f2fe">→</tspan> IOC Enrichment <tspan fill="#00f2fe">→</tspan> Automated Response <tspan fill="#00f2fe">→</tspan> Case Resolution
      </text>
    </g>
  </g>

  <rect x="0" y="412" width="1200" height="8" fill="url(#cyber-accent)" rx="4" />
</svg>